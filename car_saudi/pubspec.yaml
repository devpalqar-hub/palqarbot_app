name: villas_qatar
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.11+19

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_localisation: ^2.1.2
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  get_storage: ^2.1.1
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  device_preview: ^1.3.1
  responsive_framework: ^1.5.1
  country_pickers: ^3.0.1
  url_launcher: ^6.3.1
  pinput: ^6.0.2
  image_picker: ^1.2.3
  geolocator: 14.0.2
  socket_io_client: ^3.1.6
  mime: ^2.0.0
  app_links: ^6.0.0
  share_plus: ^12.0.2
  fluttertoast: ^9.1.0
  webview_flutter: ^4.4.4
  quill_html_editor: ^2.2.8
  pdf: ^3.11.3
  path_provider: ^2.1.5
  fl_chart: ^0.69.0
  flutter_stripe: ^13.1.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6


  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  video_player: ^2.11.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/Logo/

  fonts:
    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat.ttf


    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf

    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700


dependency_overrides:
  file_picker: ^9.0.2

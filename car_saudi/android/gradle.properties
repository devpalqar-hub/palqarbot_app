# -Xmx was 8G, i.e. this machine's *entire* physical RAM (see hs_err crash
# log: Host has 8G total) — leaving nothing for the OS, Kotlin daemon or
# Android build tools, and starving the build into instability. 3G leaves
# real headroom.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Flutter's default JDK search picks Android Studio's bundled JBR before
# JAVA_HOME. That JBR here is 17.0.7, which has a JIT compiler bug on Apple
# Silicon (hs_err: "Internal Error (assembler_aarch64.hpp:267)... Field too
# big for insn" inside the JIT itself, not in app code) that crashed the
# Gradle daemon mid build. Pointing Gradle at the newer Homebrew JDK 17.0.19
# on this machine avoids it. Update this path if that JDK is ever removed
# or upgraded (check with `/usr/libexec/java_home -V`).
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.19/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
